<header class="navbar">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div>
      <div class="navbar-title" id="viewTitle">Dashboard</div>
      <div class="navbar-subtitle">Document Intelligence Platform</div>
    </div>
  </div>
  <div class="navbar-actions">
    <span class="pill pill-muted" id="healthPill">Checking status…</span>
    {% if session.get('username') %}
    <div style="display:flex; align-items:center; gap:10px; padding-left:8px; border-left:1px solid var(--color-border); margin-left:4px;">
      <div style="width:28px; height:28px; border-radius:8px; background: linear-gradient(135deg, var(--color-primary), var(--color-accent)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;">
        {{ session.get('display_name', session.get('username'))[0]|upper }}
      </div>
      <div style="line-height:1.2;">
        <div style="font-size:13px; font-weight:600;">{{ session.get('display_name', session.get('username')) }}</div>
        <div style="font-size:11px; color: var(--color-text-muted);">{{ session.get('role', 'user')|capitalize }}</div>
      </div>
      <a href="{{ url_for('auth.logout') }}" class="btn btn-secondary" style="padding:6px 12px; font-size:12px;">Logout</a>
    </div>
    {% endif %}
  </div>
</header>
